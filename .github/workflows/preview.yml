name: PR Preview

# Per-PR preview deploys, entirely on GitHub (no external accounts/secrets).
# On open/update: build and publish ./dist to pr-preview/pr-<N>/ on the
# gh-pages branch, served at <pages-url>/pr-preview/pr-<N>/, and post the link
# as a sticky comment. On close: the action removes that folder again.
#
# This only works because vite.config.js sets `base: './'` - the built bundle
# uses relative URLs, so the same dist serves correctly from the site root and
# from a pr-preview/pr-N/ subpath. An absolute base would 404 every asset here.
#
# Previews are reachable at streak.anvaka.com/pr-preview/pr-<N>/ - Pages serves
# the whole gh-pages branch at the custom domain, and anvaka.github.io/streak/*
# 301s there path-preserving. That matters for auth: streak.anvaka.com is a
# registered origin on the OAuth client, so sign-in works on previews. If the
# custom domain is ever removed, previews fall back to anvaka.github.io, which
# must then be added to the client's Authorized JavaScript origins or gapi
# fails with idpiframe_initialization_failed and the app renders its error
# screen instead of the signed-out Welcome page.
#
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Serialize per PR so an update doesn't race its own previous run.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write       # push the preview to gh-pages
  pull-requests: write  # comment the preview URL

jobs:
  preview:
    runs-on: ubuntu-latest
    # Forks can't push to gh-pages; only run for same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # Skip the build entirely on close (the action only removes the folder).
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 24  # keep in sync with deploy.yml; see the note there
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      # Runs before the build so a red PR is visible here first - this is the
      # lane where a broken change gets caught, ahead of master.
      - run: npm test
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'

      - name: Deploy / update / remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          # Post the custom-domain URL directly rather than the github.io one,
          # which would only 301 to it.
          pages-base-url: streak.anvaka.com
